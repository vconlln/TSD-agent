name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Backend end-to-end test (offline mode)
        run: python scripts/e2e/run_e2e.py

      - name: Credential / Git / inline-AI end-to-end test
        run: python scripts/e2e/run_git_e2e.py

      - name: Agent loop end-to-end test (tools / JSON fallback / sandbox)
        run: python scripts/e2e/run_agent_e2e.py
