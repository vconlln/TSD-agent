[package]
name = "tsd-server-rs"
version = "0.1.0"
edition = "2021"
description = "TSD Agent 后端（Rust 版，按 docs/BACKEND-INTEGRATION.md 的契约分层实现）"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
