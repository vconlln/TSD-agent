appId: com.tsd.agent
productName: TSD Agent
copyright: Copyright © 2026 vconlln

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  # 渲染进程与主进程都已打包成 bundle，运行时不需要 node_modules；
  # 不排除会把 react/monaco 等依赖再塞进 asar（体积翻倍、打包变慢）。
  - '!node_modules/**'

asar: true
compression: maximum

# 内置 Python 后端（PyInstaller onedir 产物）。
# CI / 本地打包脚本会把 server/dist/tsd-server 拷到 backend-dist/tsd-server。
extraResources:
  - from: backend-dist
    to: backend

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # 文件名不用 ${productName}（含空格）：GitHub Release 会把空格替换成点号
  artifactName: TSD-Agent-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TSD Agent
  uninstallDisplayName: TSD Agent
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # 品牌化向导：安装图标 / 侧边栏 / 顶部横图 / 中文文案
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  installerLanguages:
    - zh_CN
  displayLanguageSelector: false
  artifactName: TSD-Agent-Setup-${version}.${ext}

portable:
  artifactName: TSD-Agent-Portable-${version}.${ext}

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: ${productName}-${version}.${ext}
